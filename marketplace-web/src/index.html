<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Marcus · gestão inteligente</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=marcus">
  <meta name="theme-color" content="#15803d">
  <link rel="preload" href="fontes/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Tema (claro/escuro) aplicado ANTES de desenhar a página, para não piscar branco. Igual a core/tema.service.ts. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('marcus.tema') || 'automatico';
        var escuro = t === 'escuro' || (t === 'automatico' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-tema', escuro ? 'escuro' : 'claro');
      } catch (e) { document.documentElement.setAttribute('data-tema', 'claro'); }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
