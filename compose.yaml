# Banco de dados do Marketplace (PostgreSQL 18).
# Rede do host + listen_addresses=127.0.0.1: o banco só aceita conexões de dentro da VM
# (API, n8n). Nem o Tailscale nem a internet alcançam a porta 5432.
# A senha fica no arquivo .env (fora do Git). Modelo: .env.example
services:
  db:
    image: postgres:18-alpine
    container_name: marketplace-db
    restart: unless-stopped
    network_mode: host
    # Ajuste para a VM (4 núcleos, 23 GB, dividida com outros serviços) — teste de estresse de 19/10/2026:
    # 300 conexões (cada aplicação usa no máximo 60: produção, dev, estresse, comandos), 2 GB de cache próprio
    # (o padrão era 128 MB) e memória por consulta para os relatórios somarem sem ir ao disco.
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=5432",
              "-c", "max_connections=300", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=8GB",
              "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB",
              # Arquivamento contínuo (redundância fase 1, 19/10/2026): cada pedaço do registro de alterações (WAL)
              # é compactado em /var/lib/postgresql/wal-arquivo assim que fecha — no máximo a cada 2 min
              # (archive_timeout) — e o infra/enviar-wal.sh leva para as 2 nuvens a cada 2 min (perda máx. ~4 min). Com a cópia base diária,
              # dá para recuperar o banco até qualquer minuto (infra/recuperar-banco.sh).
              "-c", "archive_mode=on", "-c", "archive_timeout=120", "-c", "wal_compression=on",
              "-c", "archive_command=test ! -f /var/lib/postgresql/wal-arquivo/%f.gz && gzip -c %p > /var/lib/postgresql/wal-arquivo/%f.gz.tmp && mv /var/lib/postgresql/wal-arquivo/%f.gz.tmp /var/lib/postgresql/wal-arquivo/%f.gz"]
    shm_size: 2gb
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    volumes:
      - marketplace_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U marketplace -d marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  marketplace_pgdata:
